<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ascend</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0c0d10;--card:#16181d;--line:#ffffff17;--fg:#f1f1f3;--hint:#8b8f98;--mint:#6ee7b7;--gold:#fcd75f}
*{box-sizing:border-box}body{margin:0;color:var(--fg);background:radial-gradient(900px 400px at 50% -80px,#2a2a22,var(--bg));min-height:100vh;font:15px/1.45 -apple-system,Segoe UI,Roboto,sans-serif;padding:0 14px 96px}
.lab{margin-top:16px;font:600 11px ui-monospace,Consolas,monospace;letter-spacing:.12em;color:var(--mint);text-transform:uppercase}
h1{font-size:30px;margin:6px 0 2px;letter-spacing:-.02em}.sub{color:var(--hint);font-size:14px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 15px;margin:9px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid .card{margin:0}
.big{font-size:21px;font-weight:700;margin-top:2px}.row{display:flex;gap:8px}.row>*{flex:1}
input[type=text],input[type=number]{width:100%;background:#0f1013;color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:13px 15px;font-size:15px;outline:0}
input:focus{border-color:#6ee7b766}
button{border:0;border-radius:14px;padding:13px;font-size:15px;font-weight:600;color:#1b1500;background:linear-gradient(90deg,#fcd75f,#fdeeb0)}
button.g{background:var(--card);color:var(--fg);border:1px solid var(--line)}
.ch{display:flex;align-items:center;gap:13px;cursor:pointer}.ic{width:44px;height:44px;border-radius:13px;background:#6ee7b71a;border:1px solid #6ee7b733;display:grid;place-items:center;font-size:20px;flex:none}
.ch b{flex:1;font-weight:600}.ch span{color:var(--hint);font:13px ui-monospace,Consolas,monospace}.ch i{color:var(--hint);font-style:normal}
.chk{display:flex;gap:12px;align-items:center;padding:9px 0}.chk input{width:22px;height:22px;accent-color:#6ee7b7;flex:none}
.item{padding:9px 0;border-bottom:1px solid var(--line);white-space:pre-line}.item:last-child{border:0}
nav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;background:#16181dee;backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;padding:6px}
nav button{flex:1;background:none;color:var(--hint);font-size:11px;padding:8px 2px;font-weight:500;border-radius:14px}nav button b{display:block;font-size:18px}nav button.on{color:var(--mint);background:#6ee7b71a}
.hint,.t{color:var(--hint);font-size:13px}.t{font-size:12px}.disc{font-size:12px;color:var(--hint);margin-top:14px}svg{width:100%;height:140px}
.ln{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
</style></head><body>
<div class="lab" id="lab"></div><h1 id="ttl"></h1><div class="sub" id="sub"></div>
<div id="v"></div>
<nav><button data-t="ref"><b>📚</b>Справочник</button><button data-t="slp"><b>😴</b>Сон</button><button data-t="chk"><b>✅</b>Чек-лист</button><button data-t="trk"><b>📈</b>Трекер</button></nav>
<script>
const tg=window.Telegram&&Telegram.WebApp;try{if(tg){tg.ready();tg.expand()}}catch(e){}
const TASKS=["SPF утром","Умывание + крем","Вечерний уход / актив","Вода по норме","Тренировка или 8к шагов","Белок по цели","Сон 7+ часов"];
const IC=["💧","💇","〰️","👕","🧍","📷","🧴","🌸","😴","🥗","💊","🔥","🫧","😮","👀","💪","⚖️","🦷","🌱","☀️","🧭","✨","🗓️"];
const TT={ref:'Справочник',slp:'Сон',chk:'Чек-лист',trk:'Трекер'};
let S={checks:{},log:[]},DATA=[],tab='ref',openSec=-1,q='';
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const $=i=>document.getElementById(i);
function save(){const v=JSON.stringify(S);try{localStorage.setItem('d',v)}catch(e){}try{tg&&tg.CloudStorage&&tg.CloudStorage.setItem('d',v,()=>{})}catch(e){}}
function load(cb){let l=null;try{l=localStorage.getItem('d')}catch(e){}
try{if(l)S=Object.assign(S,JSON.parse(l))}catch(e){}cb();
try{if(tg&&tg.CloudStorage&&tg.CloudStorage.getItem)tg.CloudStorage.getItem('d',(e,v)=>{try{if(!v)return;const c=JSON.parse(v);
(c.log||[]).forEach(x=>{if(!S.log.some(y=>y.d===x.d))S.log.push(x)});S.log.sort((a,b)=>a.d<b.d?-1:1);
Object.keys(c.checks||{}).forEach(k=>{if(!(S.checks[k]&&S.checks[k].length>=c.checks[k].length))S.checks[k]=c.checks[k]});
save();render()}catch(x){}})}catch(e){}}
function phase(){const d=today();return d<'2027-04-01'?'Набор':d<'2027-07-01'?'Сушка':'Поддержка'}
function head(){const n=Math.ceil((new Date('2027-08-31')-new Date(today()))/864e5);
$('lab').textContent='● Фаза: '+phase()+' · до лета 2027: '+Math.max(n,0)+' дн.';$('ttl').textContent=TT[tab];
$('sub').textContent=tab==='ref'?DATA.length+' глав · '+DATA.reduce((a,s)=>a+s.items.length,0)+' пунктов':'';}
function streak(){let n=0,d=new Date(today());const full=k=>(S.checks[k]||[]).length===TASKS.length;
if(!full(d.toISOString().slice(0,10)))d.setDate(d.getDate()-1);
while(full(d.toISOString().slice(0,10))){n++;d.setDate(d.getDate()-1)}return n}
function ref(v){const s=el('input');s.type='text';s.placeholder='Поиск: акне, осанка, сон…';s.value=q;const list=el('div');
s.oninput=()=>{q=s.value;openSec=-1;list.innerHTML='';fill()};v.append(s,list);
function fill(){const w=q.toLowerCase().split(/\s+/).filter(x=>x.length>2).map(x=>x.length>4?x.slice(0,x.length-2):x);
if(w.length){let c=0;DATA.forEach(sec=>sec.items.forEach(it=>{if(c<30&&w.every(x=>it.toLowerCase().includes(x))){c++;const k=el('div','card');k.append(el('div','t',sec.title),el('div','item',it));list.append(k)}}));
if(!c)list.append(el('div','hint','Ничего не нашёл'));return}
if(openSec>=0){const b=el('button','g','← Назад');b.style.margin='10px 0 0';b.onclick=()=>{openSec=-1;list.innerHTML='';fill()};list.append(b);
const k=el('div','card');k.append(el('b',0,DATA[openSec].title));DATA[openSec].items.forEach(i=>k.append(el('div','item',i)));list.append(k);return}
if(!DATA.length)list.append(el('div','hint','Загрузка…'));
DATA.forEach((sec,i)=>{const k=el('div','card ch');k.append(el('div','ic',IC[i]||'•'),el('b',0,sec.title),el('span',0,sec.items.length),el('i',0,'›'));k.onclick=()=>{openSec=i;list.innerHTML='';fill();scrollTo(0,0)};list.append(k)})}
fill();v.append(el('div','disc','Справочная информация, не медицинская рекомендация. Рецептурные препараты и процедуры — только после консультации с врачом.'))}
function slp(v){const raw=new URLSearchParams(location.search).get('s')||'';const m=s=>+s.slice(0,2)*60+ +s.slice(2);
const L=raw.split(',').filter(Boolean).map(x=>{const[a,b,c]=x.split('-');return{d:a.slice(4)+'.'+a.slice(2,4),b:m(b),w:m(c),n:(m(c)-m(b)+1440)%1440}});
const how=el('div','card hint','Пиши боту: «лёг 23:30», утром «встал 7:15» (или сразу «23:30 7:15»). Новые данные появляются, когда открываешь приложение кнопкой из бота.');
if(!L.length){v.append(how);return}
const l7=L.slice(-7),av=a=>a.reduce((x,y)=>x+y,0)/a.length,hm=x=>Math.floor(x/60)+' ч '+String(Math.round(x%60)).padStart(2,'0')+' м',
ck=x=>{x=Math.round(x)%1440;return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0')};
const ab=av(l7.map(e=>(e.b-1080+1440)%1440))+1080,aw=av(l7.map(e=>e.w)),last=L[L.length-1],g=el('div','grid');
[['Последняя ночь',hm(last.n)],['Среднее за 7',hm(av(l7.map(e=>e.n)))],['Средний отбой',ck(ab)],['Средний подъём',ck(aw)]].forEach(([a,b])=>{const c=el('div','card');c.append(el('div','t',a),el('div','big',b));g.append(c)});v.append(g);
const C=L.slice(-14),W=300/C.length;let s='<svg viewBox="0 0 300 140"><line x1="0" x2="300" y1="30" y2="30" stroke="#ffffff30" stroke-dasharray="4"/>';
C.forEach((e,i)=>{const h=Math.min(e.n/60,12)*10;s+='<rect x="'+(i*W+2)+'" y="'+(120-h)+'" width="'+(W-4)+'" height="'+h+'" rx="3" fill="'+(e.n>=420?'#6ee7b7':'#fcd75f')+'"/><text x="'+(i*W+W/2)+'" y="135" font-size="7" fill="#8b8f98" text-anchor="middle">'+e.d.slice(0,2)+'</text>'});
const cd=el('div','card');cd.innerHTML=s+'</svg>';cd.append(el('div','t','Пунктир — 9 часов. Зелёный — 7+ часов сна.'));v.append(cd);
const li=el('div','card');L.slice(-7).reverse().forEach(e=>{const r=el('div','ln');r.append(el('span',0,e.d),el('span',0,ck(e.b)+' → '+ck(e.w)),el('b',0,hm(e.n)));li.append(r)});v.append(li,how)}
function chk(v){const d=today();S.checks[d]=S.checks[d]||[];const k=el('div','card');
const info=()=>'Выполнено '+S.checks[d].length+'/'+TASKS.length+' · серия дней: '+streak(),h2=el('div','hint',info());
TASKS.forEach((t,i)=>{const r=el('label','chk'),c=el('input');c.type='checkbox';c.checked=S.checks[d].includes(i);
c.onchange=()=>{const x=S.checks[d];if(c.checked){if(!x.includes(i))x.push(i)}else x.splice(x.indexOf(i),1);save();h2.textContent=info()};
r.append(c,el('span',0,t));k.append(r)});v.append(k,h2)}
function trk(v){const k=el('div','card'),r=el('div','row'),w=el('input'),t=el('input');
w.type=t.type='number';w.step=t.step='0.1';w.placeholder='Вес, кг';t.placeholder='Талия, см';r.append(w,t);
const b=el('button',0,'Записать сегодня');b.style.cssText='margin-top:9px;width:100%';const out=el('div');
b.onclick=()=>{const x={d:today(),w:parseFloat(w.value)||null,t:parseFloat(t.value)||null};if(!x.w&&!x.t)return;
S.log=S.log.filter(e=>e.d!==x.d);S.log.push(x);S.log.sort((a,b)=>a.d<b.d?-1:1);save();draw()};
k.append(r,b);v.append(k,out);
function line(key,name){const p=S.log.filter(e=>e[key]!=null);if(!p.length)return;
const c=el('div','card');c.append(el('b',0,name+': '+p[p.length-1][key]));
if(p.length>1){const vs=p.map(e=>e[key]),mn=Math.min(...vs),sp=(Math.max(...vs)-mn)||1;
const pts=p.map((e,i)=>(10+i*280/(p.length-1)).toFixed(1)+','+(110-(e[key]-mn)/sp*90).toFixed(1)).join(' ');
const d=el('div');d.innerHTML='<svg viewBox="0 0 300 120"><polyline fill="none" stroke="#6ee7b7" stroke-width="2.5" points="'+pts+'"/></svg>';c.append(d);
const df=vs[vs.length-1]-vs[0];c.append(el('div','t',p[0].d+' → '+p[p.length-1].d+' · '+(df>0?'+':'')+df.toFixed(1)))}out.append(c)}
function draw(){out.innerHTML='';line('w','Вес');line('t','Талия');
if(!S.log.length)out.append(el('div','hint','Записей пока нет. Замеряйся раз в 2 недели, в одно и то же время.'));
else{const u=el('button','g','Удалить последнюю запись');u.style.marginTop='9px';u.onclick=()=>{S.log.pop();save();draw()};out.append(u)}}
draw()}
function render(){const v=$('v');v.innerHTML='';head();({ref,slp,chk,trk})[tab](v);
document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab))}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();scrollTo(0,0)});
window.onerror=m=>{$('v').textContent='Ошибка: '+m};
load(render);
fetch('content.json').then(r=>r.json()).then(j=>{DATA=j.sections;render()}).catch(()=>{});
</script></body></html>
